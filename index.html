function infoFor(name) {
  const hit = INFO.find(([k]) => name.includes(k));
  return hit ? `<br><br><b>Site info</b><br>${hit[1]}` : "";
}

// ---------- Helpers ----------
function dm(s) { const p = s.split("."); return +p[0] + (+(p[1] + "." + p[2])) / 60; }
function fmt(v) { const a = Math.abs(v), d = Math.floor(a), m = (a - d) * 60; return d + "&deg; " + m.toFixed(3) + "&prime;"; }
function distM(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function distLabel(m) { const ft = m * 3.28084; return ft < 1000 ? Math.round(ft) + " ft" : (m / 1609.344).toFixed(2) + " mi"; }

// Your watch fix: 19.736678 N, 156.053840 W (6 points, nearly identical)
const FIX = [19.736678, -156.053840];

// ---------- Map ----------
const map = L.map("map", { zoomControl: false }).setView([19.7, -155.95], 11);
L.control.zoom({ position: "bottomright" }).addTo(map);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19, attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics" }
).addTo(map);

const placeNames = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19 }
);

const stateLayer = L.layerGroup().addTo(map);
const estLayer = L.layerGroup().addTo(map);

const allPts = [];

// State mooring sites: solid dots
for (const [name, la, lo, g] of STATE) {
  const lat = dm(la), lon = -dm(lo);
  const col = GROUPS[g].color;
  allPts.push([lat, lon]);
  L.circleMarker([lat, lon], { radius: 6, color: "#fff", weight: 1.5, fillColor: col, fillOpacity: 1 })
    .bindPopup(
      `<b>${name}</b><br>${fmt(lat)} N, ${fmt(lon)} W<br>` +
      `<span class="mydist" data-lat="${lat}" data-lon="${lon}">Distance: turn on location</span><br>` +
      `<i>State mooring coordinates</i>${infoFor(name)}`
    )
    .addTo(stateLayer);
}

// Anchored / estimated sites: dashed rings
for (const [name, lat, lon, g, kind, note] of EST) {
  const col = GROUPS[g].color;
  allPts.push([lat, lon]);
  L.circleMarker([lat, lon], {
    radius: 9, color: col, weight: 2, dashArray: "4 3", fillColor: col, fillOpacity: 0.25
  })
    .bindPopup(
      `<b>${name}</b><br>${fmt(lat)} N, ${fmt(lon)} W<br>` +
      `<span class="mydist" data-lat="${lat}" data-lon="${lon}">Distance: turn on location</span><br>` +
      `<i>${kind === "anchor" ? "Anchored" : "Estimated"}:</i> ${note}${infoFor(name)}`
    )
    .addTo(estLayer);
}

// Scuba sites layer
const diveLayer = L.layerGroup().addTo(map);
for (const [name, lat, lon, g, note] of SITES) {
  allPts.push([lat, lon]);
  L.circleMarker([lat, lon], { radius: 5, color: "#fff", weight: 1, fillColor: GROUPS[g].color, fillOpacity: 1 })
    .bindPopup(
      `<b>${name}</b><br>${fmt(lat)} N, ${fmt(-lon)} W<br>` +
      `<span class="mydist" data-lat="${lat}" data-lon="${lon}">Distance: turn on location</span><br><i>${note}</i>${infoFor(name)}`
    )
    .addTo(diveLayer);
}


// Legend
const legend = document.getElementById("legend");
for (const k of Object.keys(GROUPS)) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<span class="sw" style="background:${GROUPS[k].color}"></span>${GROUPS[k].label}`;
  legend.appendChild(row);
}

// Layer switcher
L.control.layers(
  { "Satellite": satellite, "Street names (off)": L.layerGroup() },
  { "Place names": placeNames, "Mooring sites": stateLayer, "Estimated / anchored": estLayer, "Scuba sites (survey)": diveLayer },
  { collapsed: true, position: "topright" }
).addTo(map);

// ---------- Scrollable, searchable site list ----------
const moorMarkers = stateLayer.getLayers();
const estMarkers  = estLayer.getLayers();
const diveMarkers = diveLayer.getLayers();
const items = [];
STATE.forEach(([name, la, lo, g], i) => items.push({ name, lat: dm(la), lon: -dm(lo), g, sec: "State moorings (DLNR)", m: moorMarkers[i] }));
SITES.forEach(([name, lat, lon, g], i) => items.push({ name, lat, lon, g, sec: "Scuba sites (survey / published)", m: diveMarkers[i] }));
EST.forEach(([name, lat, lon, g], i) => items.push({ name, lat, lon, g, sec: "Estimated / anchored", m: estMarkers[i] }));

const drawer = document.getElementById("drawer");
const list = document.getElementById("list");
const q = document.getElementById("q");

function renderList() {
  const term = q.value.trim().toLowerCase();
  list.innerHTML = "";
  let cur = null;
  for (const it of items) {
    if (favOnly && !favs.has(it.name)) continue;
    if (term && !it.name.toLowerCase().includes(term)) continue;
    if (it.sec !== cur) {
      cur = it.sec;
      const h = document.createElement("div");
      h.className = "sec";
      h.textContent = cur;
      list.appendChild(h);
    }
    const b = document.createElement("button");
    b.className = "item";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = it.g ? GROUPS[it.g].color : "#e03131";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = it.name;
    const star = document.createElement("span");
    star.className = "star";
    star.textContent = favs.has(it.name) ? "★" : "☆";
    star.onclick = ev => { ev.stopPropagation(); toggleFav(it.name); };
    b.append(dot, nm, star);
    b.onclick = () => {
      map.flyTo([it.lat, it.lon], 15, { duration: 0.8 });
      if (it.m && it.m._map) it.m.openPopup();
      if (window.innerWidth < 700) drawer.classList.remove("open");
    };
    list.appendChild(b);
  }
  if (!list.children.length) {
    const none = document.createElement("div");
    none.className = "sec";
    none.textContent = "No matches";
    list.appendChild(none);
  }
}

// ---------- Live location (blue dot, like Apple/Google Maps) ----------
const meLayer = L.layerGroup().addTo(map);
const locateBtn = document.getElementById("locate");
let centeredOnMe = false;
map.on("locationfound", e => {
  meLayer.clearLayers();
  L.circle(e.latlng, { radius: e.accuracy, color: "#2f80ed", weight: 1, fillColor: "#2f80ed", fillOpacity: 0.12 }).addTo(meLayer);
  L.circleMarker(e.latlng, { radius: 8, color: "#fff", weight: 2, fillColor: "#2f80ed", fillOpacity: 1 }).addTo(meLayer);
  if (!centeredOnMe) { map.setView(e.latlng, Math.max(map.getZoom(), 15)); centeredOnMe = true; }
  locateBtn.classList.add("on");
  lastMe = e.latlng;
  refreshDist();
});
map.on("locationerror", e => {
  locateBtn.classList.remove("on");
  locateBtn.title = "Location unavailable: " + e.message + ". Allow location for this site in Settings > Safari.";
});
// Distances in site popups are measured from the live location, and update as you move.
let lastMe = null;
function refreshDist() {
  document.querySelectorAll(".mydist").forEach(el => {
    if (!lastMe) { el.textContent = "Distance: turn on location"; return; }
    const d = distM([lastMe.lat, lastMe.lng], [+el.dataset.lat, +el.dataset.lon]);
    el.textContent = distLabel(d) + " from you";
  });
}
map.on("popupopen", e => {
  refreshDist();
  const ll = e.popup.getLatLng();
  const box = e.popup.getElement() && e.popup.getElement().querySelector(".leaflet-popup-content");
  if (box && !box.querySelector(".dirs")) {
    const d = document.createElement("div");
    d.className = "dirs";
    d.innerHTML = `<a href="https://maps.apple.com/?daddr=${ll.lat},${ll.lng}&dirflg=d">Apple Maps directions</a><br>` +
                  `<a href="https://www.google.com/maps/dir/?api=1&destination=${ll.lat},${ll.lng}">Google Maps directions</a>`;
    box.appendChild(d);
  }
});

locateBtn.onclick = () => {
  if (locateBtn.classList.contains("on")) {
    map.stopLocate(); meLayer.clearLayers(); locateBtn.classList.remove("on"); centeredOnMe = false;
    lastMe = null; refreshDist(); return;
  }
  centeredOnMe = false;
  map.locate({ watch: true, enableHighAccuracy: true, setView: false });
};

// ---------- Favorites and saved spots (stored on this device only) ----------
let saved = [];
try { saved = JSON.parse(localStorage.getItem("kona-favs") || "[]"); } catch (e) {}
const favs = new Set(saved);
let favOnly = false;
function toggleFav(n) {
  favs.has(n) ? favs.delete(n) : favs.add(n);
  try { localStorage.setItem("kona-favs", JSON.stringify([...favs])); } catch (e) {}
  renderList();
}
document.getElementById("favbtn").onclick = () => {
  favOnly = !favOnly;
  document.getElementById("favbtn").classList.toggle("on", favOnly);
  renderList();
};

let pins = [];
try { pins = JSON.parse(localStorage.getItem("kona-pins") || "[]"); } catch (e) {}
const pinLayer = L.layerGroup().addTo(map);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function drawPins() {
  pinLayer.clearLayers();
  pins.forEach(p => L.circleMarker([p.lat, p.lon], { radius: 7, color: "#fff", weight: 2, fillColor: "#f5c451", fillOpacity: 1 })
    .bindPopup(`<b>${esc(p.name)}</b><br>My saved spot`).addTo(pinLayer));
}
drawPins();
document.getElementById("pinbtn").onclick = () => {
  if (!lastMe) { document.getElementById("pinbtn").title = "Turn on location first (blue button)"; return; }
  const name = prompt("Name this spot:", "My spot");
  if (!name) return;
  pins.push({ name, lat: lastMe.lat, lon: lastMe.lng });
  try { localStorage.setItem("kona-pins", JSON.stringify(pins)); } catch (e) {}
  drawPins();
};

document.getElementById("toggle").onclick = () => drawer.classList.toggle("open");
document.getElementById("close").onclick = () => drawer.classList.remove("open");
q.addEventListener("input", renderList);
renderList();
if (window.innerWidth >= 700) drawer.classList.add("open");

map.fitBounds(L.latLngBounds(allPts).pad(0.05));
</script>
